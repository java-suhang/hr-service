<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>휴가 · HR</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/attendance.css">
</head>
<body>
<!-- U04 휴가 신청 -->
<header id="topnav"></header>

<main class="page">
    <div class="page-head">
        <div>
            <h1>휴가</h1>
            <div class="sub" id="balanceText">&nbsp;</div>
        </div>
        <div class="actions">
            <button class="btn btn-primary" id="openApply" type="button">+ 휴가 신청</button>
        </div>
    </div>

    <section class="card">
        <div class="card-head">
            <h2>신청 내역</h2>
            <select class="select" id="yearSelect" aria-label="연도"></select>
        </div>
        <div class="card-body">
            <table class="table">
                <thead>
                <tr>
                    <th>종류</th>
                    <th>기간</th>
                    <th class="num">일수</th>
                    <th>사유</th>
                    <th>상태</th>
                    <th>신청일</th>
                    <th></th>
                </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
            <div class="pager" id="pager"></div>
        </div>
    </section>
</main>

<dialog class="modal" id="applyModal">
    <form id="applyForm">
        <div class="modal-head">휴가 신청</div>
        <div class="modal-body">
            <div class="field">
                <label for="leaveType">종류</label>
                <select class="select" id="leaveType">
                    <option value="ANNUAL">연차</option>
                    <option value="HALF_AM">오전 반차</option>
                    <option value="HALF_PM">오후 반차</option>
                    <option value="SICK">병가</option>
                    <option value="ETC">기타</option>
                </select>
            </div>
            <div class="row">
                <div class="field">
                    <label for="startDate">시작일</label>
                    <input class="input" type="date" id="startDate" required>
                </div>
                <div class="field">
                    <label for="endDate">종료일</label>
                    <input class="input" type="date" id="endDate" required>
                </div>
            </div>
            <div class="field">
                <label for="reason">사유</label>
                <textarea class="textarea" id="reason" maxlength="500" placeholder="사유 입력"></textarea>
            </div>
            <div class="notice-box" id="previewBox">기간을 고르면 차감 일수가 표시됩니다</div>
        </div>
        <div class="modal-foot">
            <button class="btn" type="button" id="closeApply">취소</button>
            <button class="btn btn-primary" type="submit" id="submitApply">신청하기</button>
        </div>
    </form>
</dialog>

<script src="../js/api.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/attendance-common.js"></script>
<script src="../js/leave.js"></script>
</body>
</html>
