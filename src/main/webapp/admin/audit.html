<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>감사 로그 · HR Admin</title>
    <link rel="stylesheet" href="../css/common.css">
</head>
<body>
<!-- 감사 로그 (REQ-21) -->
<div class="admin-shell">
    <aside id="sidebar"></aside>
    <div class="admin-main">
        <header id="topbar"></header>
        <main class="page">
            <div class="page-head">
                <div>
                    <h1>감사 로그</h1>
                    <div class="sub" id="subText">누가 언제 무엇을 바꿨는지 기록합니다</div>
                </div>
            </div>
            <section class="card">
                <div class="filters" style="padding-top:16px">
                    <select class="select" id="fTable" aria-label="대상">
                        <option value="">대상 전체</option>
                        <option value="EMPLOYEE">직원</option>
                        <option value="DEPARTMENT">부서</option>
                        <option value="JOB_POSITION">직급</option>
                        <option value="ATTENDANCE">근태</option>
                        <option value="LEAVE_BALANCE">연차</option>
                        <option value="APPROVAL_DOC">결재</option>
                        <option value="EXPENSE">경비</option>
                    </select>
                    <select class="select" id="fAction" aria-label="작업">
                        <option value="">작업 전체</option>
                        <option value="CREATE">생성</option>
                        <option value="UPDATE">수정</option>
                        <option value="DELETE">삭제</option>
                        <option value="RESIGN">퇴사</option>
                        <option value="PASSWORD_RESET">비밀번호 초기화</option>
                        <option value="APPROVE">승인</option>
                        <option value="REJECT">반려</option>
                    </select>
                    <input class="input" type="date" id="fFrom" aria-label="시작일">
                    <input class="input" type="date" id="fTo" aria-label="종료일">
                </div>
                <table class="table">
                    <thead><tr><th>일시</th><th>작업자</th><th>작업</th><th>대상</th><th>변경 전</th><th>변경 후</th></tr></thead>
                    <tbody id="rows"><tr><td class="empty" colspan="6">불러오는 중…</td></tr></tbody>
                </table>
                <div class="pager" id="pager"></div>
            </section>
        </main>
    </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/layout.js"></script>
<script>
(function () {
    Layout.admin('audit');
    const $ = (id) => document.getElementById(id);
    const ACTION = { CREATE: '생성', UPDATE: '수정', DELETE: '삭제', RESIGN: '퇴사', PASSWORD_RESET: '비밀번호 초기화', APPROVE: '승인', REJECT: '반려' };
    let page = 1;

    /** JSON 문자열 → 바뀐 필드만 보기 좋게 */
    function pretty(json, other) {
        if (!json) return '<span class="muted">-</span>';
        let obj, cmp = null;
        try { obj = JSON.parse(json); cmp = other ? JSON.parse(other) : null; } catch (e) { return esc(json); }
        const keys = Object.keys(obj).filter((k) => !cmp || JSON.stringify(cmp[k]) !== JSON.stringify(obj[k]));
        if (!keys.length) return '<span class="muted">변경 없음</span>';
        return keys.slice(0, 8).map((k) => `<div><span class="mono">${esc(k)}</span>: ${esc(obj[k] == null ? '-' : typeof obj[k] === 'object' ? JSON.stringify(obj[k]) : obj[k])}</div>`).join('');
    }

    async function load() {
        try {
            const data = await api.get('admin/audit-logs', { table: $('fTable').value, action: $('fAction').value,
                from: $('fFrom').value, to: $('fTo').value, page, size: 20 });
            $('subText').textContent = `${data.total}건`;
            $('rows').innerHTML = data.items.length ? data.items.map((l) => `<tr>
                <td style="white-space:nowrap">${esc((l.createdAt || '').replace('T', ' '))}</td>
                <td>${esc(l.actorName || '-')}</td>
                <td><span class="badge badge-blue">${esc(ACTION[l.action] || l.action)}</span></td>
                <td><span class="mono">${esc(l.targetTable)}${l.targetId ? ' #' + l.targetId : ''}</span></td>
                <td class="json-cell">${pretty(l.beforeVal, l.afterVal)}</td>
                <td class="json-cell">${pretty(l.afterVal, l.beforeVal)}</td></tr>`).join('')
                : '<tr><td class="empty" colspan="6">기록이 없습니다</td></tr>';
            renderPager($('pager'), data, (p) => { page = p; load(); });
        } catch (e) { $('rows').innerHTML = `<tr><td class="empty" colspan="6">${esc(e.message)}</td></tr>`; }
    }
    ['fTable', 'fAction', 'fFrom', 'fTo'].forEach((id) => $(id).addEventListener('change', () => { page = 1; load(); }));
    load();
})();
</script>
</body>
</html>
