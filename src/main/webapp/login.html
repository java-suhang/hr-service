<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 · HR</title>
    <link rel="stylesheet" href="css/common.css">
</head>
<body>
<!-- U01 로그인 -->
<div class="login-shell">
    <section class="login-brand">
        <div class="logo">HR.</div>
        <div>
            <h1>출근부터 결재까지,<br>한 곳에서.</h1>
            <p>근태 · 휴가 · 결재 · 평가를 통합 관리하는 인사 서비스</p>
        </div>
        <div class="copy">© HR Service</div>
    </section>

    <section class="login-panel">
        <form id="loginForm" novalidate>
            <h2>로그인</h2>
            <div class="sub">사내 계정으로 로그인하세요</div>
            <div class="field">
                <label for="loginId">아이디</label>
                <input class="input" id="loginId" name="loginId" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="password">비밀번호</label>
                <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <label class="sub" style="display:flex;gap:6px;align-items:center;cursor:pointer">
                <input type="checkbox" id="saveId"> 아이디 저장
            </label>
            <div class="form-error" id="loginError" role="alert"></div>
            <button class="btn btn-primary" type="submit">로그인</button>
        </form>
    </section>
</div>

<script>
(function () {
    const form = document.getElementById('loginForm');
    const error = document.getElementById('loginError');
    const saveId = document.getElementById('saveId');
    const KEY = 'hr.savedLoginId';
    const home = (me) => me.admin ? 'admin/dashboard.html' : 'user/home.html';

    try {
        const saved = localStorage.getItem(KEY);
        if (saved) { form.loginId.value = saved; saveId.checked = true; form.password.focus(); } else { form.loginId.focus(); }
    } catch (e) { form.loginId.focus(); }

    // 이미 로그인한 상태면 바로 이동
    fetch('api/auth/me', { credentials: 'same-origin' })
        .then((res) => (res.ok ? res.json() : null))
        .then((me) => { if (me) location.replace(home(me)); })
        .catch(() => {});

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        error.textContent = '';
        const loginId = form.loginId.value.trim();
        const password = form.password.value;
        if (!loginId || !password) {
            error.textContent = '아이디와 비밀번호를 입력하세요';
            return;
        }
        const btn = form.querySelector('button[type=submit]');
        btn.disabled = true;
        try {
            const res = await fetch('api/auth/login', {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ loginId, password }),
            });
            const data = await res.json().catch(() => null);
            if (!res.ok) throw new Error((data && data.message) || '로그인하지 못했습니다');
            try {
                if (saveId.checked) localStorage.setItem(KEY, loginId); else localStorage.removeItem(KEY);
            } catch (ignored) { /* 저장소를 쓸 수 없는 브라우저 */ }
            location.replace(home(data));
        } catch (err) {
            error.textContent = err.message === 'Failed to fetch' ? '서버에 연결할 수 없습니다' : err.message;
            form.password.value = '';
            form.password.focus();
        } finally {
            btn.disabled = false;
        }
    });
})();
</script>
</body>
</html>
