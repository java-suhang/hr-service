<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>결재함 · HR</title>
    <link rel="stylesheet" href="../css/common.css">
</head>
<body>
<!-- U05 결재함 (REQ-17, 18) -->
<header id="topnav"></header>

<main class="page">
    <div class="page-head">
        <div>
            <h1>결재함</h1>
            <div class="sub">내가 올린 문서와 내가 처리할 문서</div>
        </div>
    </div>

    <div class="pills" role="tablist" aria-label="결재함 종류">
        <button type="button" role="tab" data-box="mine">내가 올린 문서 <span data-count="mine"></span></button>
        <button type="button" role="tab" data-box="todo">결재 대기 <span data-count="todo"></span></button>
        <button type="button" role="tab" data-box="done">완료</button>
    </div>

    <div class="split">
        <section class="card">
            <div class="doc-list" id="list" aria-live="polite"></div>
            <div class="pager" id="pager"></div>
        </section>
        <section class="card doc-detail" id="detail" aria-live="polite">
            <div class="placeholder">왼쪽에서 문서를 선택하세요</div>
        </section>
    </div>
</main>

<script src="../js/api.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/approval-view.js"></script>
<script src="../js/approvals.js"></script>
</body>
</html>
