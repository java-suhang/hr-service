<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>결재 관리 · HR Admin</title>
    <link rel="stylesheet" href="../css/common.css">
</head>
<body>
<!-- A03 결재 관리 (REQ-13, 17, 19) -->
<div class="admin-shell">
    <aside id="sidebar"></aside>
    <div class="admin-main">
        <header id="topbar"></header>
        <main class="page">
            <div class="page-head">
                <div>
                    <h1>결재 관리</h1>
                    <div class="sub" id="subText">&nbsp;</div>
                </div>
                <div class="actions">
                    <input class="input" id="fKeyword" placeholder="기안자, 제목 검색" aria-label="검색어">
                    <select class="select" id="fType" aria-label="문서 종류">
                        <option value="">문서 종류 전체</option>
                        <option value="LEAVE">휴가</option>
                        <option value="EXPENSE">경비</option>
                    </select>
                    <select class="select" id="fStatus" aria-label="상태">
                        <option value="TODO">대기 (내 차례)</option>
                        <option value="IN_PROGRESS">진행 중 (전체)</option>
                        <option value="APPROVED">승인</option>
                        <option value="REJECTED">반려</option>
                        <option value="CANCELED">취소</option>
                        <option value="ALL">전체</option>
                    </select>
                </div>
            </div>

            <div class="split wide-left">
                <section class="card">
                    <table class="table">
                        <thead>
                        <tr><th>종류</th><th>기안자</th><th>내용</th><th>기안일</th><th>단계</th><th>상태</th></tr>
                        </thead>
                        <tbody id="rows"><tr><td class="empty" colspan="6">불러오는 중…</td></tr></tbody>
                    </table>
                    <div class="pager" id="pager"></div>
                </section>
                <section class="card doc-detail" id="detail" aria-live="polite">
                    <div class="placeholder">문서를 선택하세요</div>
                </section>
            </div>
        </main>
    </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/approval-view.js"></script>
<script>
(function () {
    Layout.admin('approvals');
    const $ = (id) => document.getElementById(id);
    const query = new URLSearchParams(location.search);
    let page = 1;
    let selected = Number(query.get('id')) || null;

    async function load() {
        try {
            const data = await api.get('admin/approvals', { status: $('fStatus').value, type: $('fType').value,
                keyword: $('fKeyword').value.trim(), page, size: 15 });
            if (!data.items.length && page > 1) { page -= 1; return load(); }
            $('subText').textContent = '내 차례인 문서 ' + data.counts.todo + '건'
                + ($('fStatus').value === 'TODO' ? '' : ' · 검색 결과 ' + data.total + '건');
            $('rows').innerHTML = data.items.length ? data.items.map((d) => '<tr class="clickable'
                + (d.docId === selected ? ' selected' : '') + '" data-id="' + d.docId + '" tabindex="0">'
                + '<td>' + ApprovalView.typeTag(d.docType) + '</td>'
                + '<td>' + esc(d.drafterName) + '<div class="muted">' + esc(d.drafterDept || '') + '</div></td>'
                + '<td>' + esc(d.title) + '</td>'
                + '<td>' + esc(ApprovalView.dotDate(d.createdAt).slice(5)) + '</td>'
                + '<td>' + d.currentStep + '/' + d.totalSteps + '</td>'
                + '<td>' + ApprovalView.statusBadge(d.status) + '</td></tr>').join('')
                : '<tr><td class="empty" colspan="6">' + ($('fStatus').value === 'TODO' ? '처리할 문서가 없습니다' : '문서가 없습니다') + '</td></tr>';
            renderPager($('pager'), data, (p) => { page = p; load(); });
        } catch (e) {
            $('rows').innerHTML = '<tr><td class="empty" colspan="6">' + esc(e.message) + '</td></tr>';
        }
    }

    function select(id) {
        selected = id;
        history.replaceState(null, '', '?id=' + id);
        document.querySelectorAll('#rows tr[data-id]').forEach((tr) => tr.classList.toggle('selected', Number(tr.dataset.id) === id));
        ApprovalView.load($('detail'), id, { onChange: load });
    }

    $('rows').addEventListener('click', (ev) => {
        const tr = ev.target.closest('tr[data-id]');
        if (tr) select(Number(tr.dataset.id));
    });
    $('rows').addEventListener('keydown', (ev) => {
        const tr = ev.target.closest('tr[data-id]');
        if (tr && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); select(Number(tr.dataset.id)); }
    });
    ['fType', 'fStatus'].forEach((id) => $(id).addEventListener('change', () => { page = 1; load(); }));
    let timer = null;
    $('fKeyword').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => { page = 1; load(); }, 300); });

    load();
    if (selected) select(selected);
})();
</script>
</body>
</html>
