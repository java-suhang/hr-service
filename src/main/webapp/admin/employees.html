<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>직원 관리 · HR Admin</title>
    <link rel="stylesheet" href="../css/common.css">
</head>
<body>
<!-- A02 직원 관리 (REQ-04, REQ-05) -->
<div class="admin-shell">
    <aside id="sidebar"></aside>
    <div class="admin-main">
        <header id="topbar"></header>
        <main class="page">
            <div class="page-head">
                <div>
                    <h1>직원 관리</h1>
                    <div class="sub" id="subText">&nbsp;</div>
                </div>
                <div class="actions">
                    <button class="btn btn-primary" id="openCreate" type="button">+ 직원 등록</button>
                </div>
            </div>

            <section class="card">
                <div class="filters" style="padding-top:16px">
                    <input class="input" id="fKeyword" placeholder="이름, 사번, 아이디 검색" aria-label="검색어">
                    <select class="select" id="fDept" aria-label="부서"><option value="">부서 전체</option></select>
                    <select class="select" id="fPos" aria-label="직급"><option value="">직급 전체</option></select>
                    <select class="select" id="fStatus" aria-label="상태">
                        <option value="">상태 전체</option>
                        <option value="ACTIVE">재직</option>
                        <option value="LEAVE">휴직</option>
                        <option value="RESIGNED">퇴사</option>
                    </select>
                </div>
                <table class="table">
                    <thead>
                    <tr>
                        <th>사번</th><th>이름</th><th>아이디</th><th>부서</th><th>직급</th><th>상사</th>
                        <th>권한</th><th>입사일</th><th>연락처</th><th>상태</th><th></th>
                    </tr>
                    </thead>
                    <tbody id="rows"><tr><td class="empty" colspan="11">불러오는 중…</td></tr></tbody>
                </table>
                <div class="pager" id="pager"></div>
            </section>
        </main>
    </div>
</div>

<dialog class="modal" id="empModal" style="width:640px">
    <form id="empForm" novalidate>
        <div class="modal-head" id="empTitle">직원 등록</div>
        <div class="modal-body">
            <div class="row">
                <div class="field"><label for="eEmpNo">사번 *</label><input class="input" id="eEmpNo" maxlength="20" required></div>
                <div class="field"><label for="eName">이름 *</label><input class="input" id="eName" maxlength="50" required></div>
            </div>
            <div class="row" id="accountRow">
                <div class="field"><label for="eLoginId">로그인 아이디 *</label><input class="input" id="eLoginId" maxlength="30" autocomplete="off"></div>
                <div class="field"><label for="ePassword">초기 비밀번호 * (8자 이상, 영문+숫자)</label><input class="input" type="password" id="ePassword" autocomplete="new-password"></div>
            </div>
            <div class="row">
                <div class="field"><label for="eDept">부서 *</label><select class="select" id="eDept" required></select></div>
                <div class="field"><label for="ePos">직급 *</label><select class="select" id="ePos" required></select></div>
            </div>
            <div class="row">
                <div class="field"><label for="eManager">상사 (결재 1단계)</label><select class="select" id="eManager"></select></div>
                <div class="field"><label for="eHire">입사일 *</label><input class="input" type="date" id="eHire" required></div>
            </div>
            <div class="row">
                <div class="field"><label for="eEmail">이메일</label><input class="input" type="email" id="eEmail" maxlength="100"></div>
                <div class="field"><label for="ePhone">연락처</label><input class="input" id="ePhone" maxlength="20" placeholder="010-0000-0000"></div>
            </div>
            <div class="row">
                <div class="field"><label for="eRole">권한</label>
                    <select class="select" id="eRole"><option value="USER">USER</option><option value="ADMIN">ADMIN</option></select></div>
                <div class="field"><label for="eStatus">상태</label>
                    <select class="select" id="eStatus"><option value="ACTIVE">재직</option><option value="LEAVE">휴직</option><option value="RESIGNED">퇴사</option></select></div>
            </div>
            <div class="field" id="annualField"><label for="eAnnual">올해 연차 (일)</label>
                <input class="input" type="number" id="eAnnual" value="15" min="0" max="365" step="0.5"></div>
            <div class="form-error" id="empError" role="alert"></div>
        </div>
        <div class="modal-foot">
            <button class="btn" type="button" data-close="empModal">취소</button>
            <button class="btn btn-primary" type="submit">저장</button>
        </div>
    </form>
</dialog>

<dialog class="modal" id="pwModal">
    <form id="pwForm">
        <div class="modal-head">비밀번호 초기화</div>
        <div class="modal-body">
            <div class="notice-box" id="pwWho" style="margin-bottom:14px"></div>
            <div class="field"><label for="pwNew">새 비밀번호 (8자 이상, 영문+숫자)</label>
                <input class="input" type="password" id="pwNew" autocomplete="new-password" required></div>
            <div class="form-error" id="pwError" role="alert"></div>
        </div>
        <div class="modal-foot">
            <button class="btn" type="button" data-close="pwModal">취소</button>
            <button class="btn btn-primary" type="submit">초기화</button>
        </div>
    </form>
</dialog>

<script src="../js/api.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/admin-employees.js"></script>
</body>
</html>
